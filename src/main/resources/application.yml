spring:
  application:
    name: fraud-dispute-agent
  datasource:
    url: ${CAPSTONE_DB_URL:jdbc:h2:file:./data/fraudcase;AUTO_SERVER=FALSE}
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: always

logging:
  level:
    root: INFO
    dev.langchain4j: WARN

capstone:
  human-review-required: true
  allow-financial-actions: false
  allow-customer-contact: false
  fixed-clock: ${CAPSTONE_FIXED_CLOCK:}
  retrieval:
    top-k: 4
    similarity-threshold: 0.72
  memory:
    max-messages: 12
  tools:
    timeout-ms: 2500
    deterministic-seed: fraud-training-v1
  model:
    model-name: ${CAPSTONE_MODEL_NAME:claude-sonnet-4-5}
    api-key: ${ANTHROPIC_API_KEY:}
    timeout-seconds: 60
    temperature: 0.0
    max-tokens: 2048
    max-tool-invocations: 12
  security:
    demo-password: ${CAPSTONE_DEMO_PASSWORD:}
