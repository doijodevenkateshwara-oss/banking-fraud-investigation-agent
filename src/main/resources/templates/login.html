<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-name">FRAUDOPS</span> <span class="brand-ai">AI</span>
    <span class="synthetic-flag">SYNTHETIC TRAINING DATA</span></div></header>
<main id="main" class="shell">
    <section class="content narrow">
        <div class="card">
            <h1>Sign in</h1>
            <p class="subtitle">Synthetic demo identities: agent01, investigator01, reviewer08, lead01, auditor01.</p>
            <div class="alert alert-error" role="alert" th:if="${param.error}">Invalid username or password.</div>
            <div class="alert alert-info" role="status" th:if="${param.logout}">You have been signed out.</div>
            <form th:action="@{/login}" method="post">
                <p><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required autofocus></p>
                <p><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></p>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
